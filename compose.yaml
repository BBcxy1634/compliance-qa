name: compliance-qa

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: compliance-qa:2.0.0
    command:
      - python
      - -m
      - uvicorn
      - src.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      TORCH_DEVICE: ${TORCH_DEVICE:-cpu}
      TRACE_ENABLED: ${TRACE_ENABLED:-false}
      TRACE_DIR: /app/.cache/traces
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data:ro
      - ./chroma_db:/app/chroma_db:ro
      - huggingface-cache:/app/.cache/huggingface
      - trace-data:/app/.cache/traces
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  huggingface-cache:
  trace-data:
